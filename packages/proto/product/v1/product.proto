syntax = "proto3";

package product.v1;
option go_package = "ecommerce-platform/packages/proto/gen/go/product/v1;productv1";

service ProductService {
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc CheckAndDeductStock(CheckAndDeductStockRequest) returns (CheckAndDeductStockResponse);
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  int64 price = 4;
  int32 stock = 5;
}

message StockItem {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckAndDeductStockRequest {
  repeated StockItem items = 1;
  string order_id = 2;
}

message CheckAndDeductStockResponse {
  bool success = 1;
  string message = 2;
}
