services:
  # ==============================================================================
  # 1. DATABASE & CONNECTION POOLER
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - ecommerce-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  # Inisialisasi 4 Database (auth_db, product_db, order_db, payment_db) jika belum ada
  init-db:
    image: postgres:16-alpine
    container_name: ecommerce-init-db
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    entrypoint:
      - sh
      - -c
      - |
        echo "Verifying microservice databases (auth_db, product_db, order_db, payment_db)..."
        for db in auth_db product_db order_db payment_db; do
          psql -h postgres -U ${POSTGRES_USER:-postgres} -tc "SELECT 1 FROM pg_database WHERE datname = '$$db'" | grep -q 1 || \
          psql -h postgres -U ${POSTGRES_USER:-postgres} -c "CREATE DATABASE $$db;"
        done
        echo "Database verification complete."

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ecommerce-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      DB_HOST: postgres
      DB_PORT: 5432
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      AUTH_TYPE: plain
      ADMIN_USERS: ${POSTGRES_USER:-postgres}
      STATS_USERS: ${POSTGRES_USER:-postgres}
    ports:
      - '${PGBOUNCER_PORT:-6432}:6432'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ==============================================================================
  # 2. CACHE & MESSAGE BROKER
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbit loopback_users []'
    ports:
      - '${RABBITMQ_AMQP_PORT:-5672}:5672' # AMQP Protocol
      - '${RABBITMQ_MGMT_PORT:-15672}:15672' # Management Web Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5

  # ==============================================================================
  # 3. CQRS SEARCH ENGINE
  # ==============================================================================
  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: ecommerce-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}'
    ports:
      - '${ES_PORT:-9200}:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ['CMD-SHELL', "curl -s http://localhost:9200/_cat/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 4. OBSERVABILITY: TRACING, LOGS & METRICS
  # ==============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.60.0
    container_name: ecommerce-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '${JAEGER_PORT:-16686}:16686' # Jaeger Web UI
    networks:
      - ecommerce-network

  loki:
    image: grafana/loki:3.1.0
    container_name: ecommerce-loki
    restart: unless-stopped
    ports:
      - '${LOKI_PORT:-3100}:3100'
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ecommerce-network

  alloy:
    image: grafana/alloy:v1.3.0
    container_name: ecommerce-alloy
    restart: unless-stopped
    ports:
      - '${ALLOY_GRPC_PORT:-4317}:4317' # OTLP gRPC
      - '${ALLOY_HTTP_PORT:-4318}:4318' # OTLP HTTP
      - '${ALLOY_UI_PORT:-12345}:12345' # Alloy UI
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    depends_on:
      - jaeger
      - loki
    networks:
      - ecommerce-network

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: ecommerce-prometheus
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - ecommerce-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ecommerce-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - '${GRAFANA_PORT:-3010}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - jaeger
      - loki
      - prometheus
    networks:
      - ecommerce-network

  # ==============================================================================
  # 5. CLOUDFLARE EDGE OBSERVABILITY EXPORTER
  # ==============================================================================
  cloudflare-exporter:
    image: lablabs/cloudflare_exporter:latest
    container_name: ecommerce-cloudflare-exporter
    restart: unless-stopped
    env_file:
      - .env.infra
    environment:
      - CF_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CF_ZONES=${CLOUDFLARE_ZONE_ID:-}
      - FREE_TIER=${CLOUDFLARE_FREE_TIER:-true}
      - LISTEN=:8080
    ports:
      - '${CLOUDFLARE_EXPORTER_PORT:-8085}:8080'
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:
  loki_data:
  prometheus_data:
  grafana_data:
