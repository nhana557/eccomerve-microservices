<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16191E" />
      <stop offset="100%" stop-color="#0F1115" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AA5B" />
      <stop offset="100%" stop-color="#028045" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232730" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1B1E26" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Subtle Decorative Circle Glow -->
  <circle cx="300" cy="270" r="160" fill="#00AA5B" opacity="0.08" filter="url(#glow)" />
  <circle cx="300" cy="270" r="120" fill="none" stroke="#232936" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Center Product Box / Device Icon Representation -->
  <g transform="translate(190, 160)">
    <!-- Base Card -->
    <rect x="0" y="0" width="220" height="220" rx="32" fill="url(#cardGrad)" stroke="#2B313F" stroke-width="2" />

    <!-- Camera/Lens or Box Silhouette -->
    <circle cx="110" cy="100" r="48" fill="#14161C" stroke="#00AA5B" stroke-width="3" opacity="0.9" />
    <circle cx="110" cy="100" r="28" fill="url(#primaryGrad)" opacity="0.2" />
    <circle cx="110" cy="100" r="16" fill="#00AA5B" opacity="0.8" />
    <circle cx="135" cy="75" r="7" fill="#00AA5B" />

    <!-- Modern Tech Highlights -->
    <rect x="50" y="165" width="120" height="8" rx="4" fill="#2E3444" />
    <rect x="75" y="181" width="70" height="6" rx="3" fill="#00AA5B" opacity="0.6" />
  </g>

  <!-- T.STORE Branding & Badge -->
  <g transform="translate(300, 440)" text-anchor="middle">
    <!-- Brand Pill -->
    <rect x="-95" y="-18" width="190" height="34" rx="17" fill="#14171E" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.5" />
    <text x="-16" y="4" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="0.5">T<tspan fill="#38BDF8">.</tspan>STORE</text>
    <text x="56" y="2" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700">OFFICIAL</text>

    <!-- Subtitle -->
    <text x="0" y="40" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Official Product Showcase</text>
  </g>
</svg>
