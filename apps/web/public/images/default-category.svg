<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="catBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232B" />
      <stop offset="100%" stop-color="#14171E" />
    </linearGradient>
    <linearGradient id="tokopediaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AA5B" />
      <stop offset="100%" stop-color="#028045" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="200" rx="36" fill="url(#catBg)" stroke="#2B313E" stroke-width="3" />

  <!-- 4-Grid Modern Category Layout -->
  <g transform="translate(46, 46)">
    <!-- Top Left Box (Active Green) -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#tokopediaGreen)" />
    <circle cx="24" cy="24" r="8" fill="#FFFFFF" opacity="0.9" />

    <!-- Top Right Box -->
    <rect x="60" y="0" width="48" height="48" rx="14" fill="#252A36" stroke="#333A4A" stroke-width="1.5" />
    <rect x="74" y="20" width="20" height="8" rx="4" fill="#00AA5B" opacity="0.6" />

    <!-- Bottom Left Box -->
    <rect x="0" y="60" width="48" height="48" rx="14" fill="#252A36" stroke="#333A4A" stroke-width="1.5" />
    <rect x="14" y="80" width="20" height="8" rx="4" fill="#00AA5B" opacity="0.6" />

    <!-- Bottom Right Box -->
    <rect x="60" y="60" width="48" height="48" rx="14" fill="#252A36" stroke="#333A4A" stroke-width="1.5" />
    <circle cx="84" cy="84" r="6" fill="#64748B" />
  </g>
</svg>
